name: anime_ui
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  bloc: ^9.0.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3

dev_dependencies:
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.9.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/svgs/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

flutter_gen:
  output: lib/core/gen/ 
  line_length: 80 

  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true  